name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Kown:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        # 版本号走 build setting:CI 用 MARKETING_VERSION / CURRENT_PROJECT_VERSION 注入
        # (CURRENT_PROJECT_VERSION = git 提交数,单调递增 → Sparkle 才认得出是新版本)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Kown
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 bo xiao"
        # 语音听写(STT)— 麦克风 + 语音识别授权
        NSMicrophoneUsageDescription: "Kown 用麦克风把你的语音转成文字,填进输入框。"
        NSSpeechRecognitionUsageDescription: "Kown 用语音识别把你说的话转写成文字。"
        # ── Sparkle 自动更新（feed/公钥;频率与自动安装由 UpdaterService 经 UserDefaults 管理）──
        SUFeedURL: https://raw.githubusercontent.com/macuhy/kown-mac/main/appcast.xml
        SUPublicEDKey: QxXWME0pGom6NLGkoNq6AdkK8h+i+ZttNeED2No5HT8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # 更新弹窗不显示 release notes 网页（GitHub 页面），只留按钮
        SUShowReleaseNotes: false
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # 语音听写需要麦克风(hardened runtime 下的资源访问例外)
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        # 本地构建的默认版本;CI 用命令行覆盖(CURRENT_PROJECT_VERSION=git 提交数)。
        MARKETING_VERSION: "0.10.7"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Sparkle
        product: Sparkle

schemes:
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
