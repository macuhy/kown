name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  Kown:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        # 版本号走 build setting:CI 用 MARKETING_VERSION / CURRENT_PROJECT_VERSION 注入
        # (CURRENT_PROJECT_VERSION = git 提交数,单调递增 → Sparkle 才认得出是新版本)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Kown
        # 深链:kown://ask?q=...&mode=... / kown://new?mode=... / kown://open?id=...
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaobo.kown
            CFBundleURLSchemes: [kown]
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 bo xiao"
        # 语音听写(STT)— 麦克风 + 语音识别授权
        NSMicrophoneUsageDescription: "Kown 用麦克风把你的语音转成文字,填进输入框。"
        NSSpeechRecognitionUsageDescription: "Kown 用语音识别把你说的话转写成文字。"
        # 设备工具:在系统「提醒事项」创建提醒、在「日历」创建/读取日程、用 AppleScript 控制「备忘录」
        NSRemindersFullAccessUsageDescription: "Kown 可以把你的待办写进系统「提醒事项」。"
        NSCalendarsFullAccessUsageDescription: "Kown 可以把你的日程写进系统「日历」,并读取你最近的安排。"
        NSAppleEventsUsageDescription: "Kown 用自动化把整理好的内容写进「备忘录」。"
        # ── Sparkle 自动更新（feed/公钥;频率与自动安装由 UpdaterService 经 UserDefaults 管理）──
        SUFeedURL: https://raw.githubusercontent.com/macuhy/kown-mac/main/appcast.xml
        SUPublicEDKey: QxXWME0pGom6NLGkoNq6AdkK8h+i+ZttNeED2No5HT8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # 更新弹窗不显示 release notes 网页（GitHub 页面），只留按钮
        SUShowReleaseNotes: false
        # ── 系统级划词 AI（NSServices）──
        # 任意 app 选中文字 → 右键「服务」菜单。NSMessage 对应 MacServicesProvider 的
        # @objc handler（selector = NSMessage + ":userData:error:"）；NSPortName = 可执行名。
        # 首次安装后服务菜单可能要等 pbs 重扫（注销/重登或 NSUpdateDynamicServices）才出现。
        NSServices:
          - NSMenuItem:
              default: 用 Kown 翻译
            NSMessage: kownServiceTranslate
            NSPortName: Kown
            NSSendTypes: [NSStringPboardType]
          - NSMenuItem:
              default: 用 Kown 总结
            NSMessage: kownServiceSummarize
            NSPortName: Kown
            NSSendTypes: [NSStringPboardType]
          - NSMenuItem:
              default: 问 Kown
            NSMessage: kownServiceAsk
            NSPortName: Kown
            NSSendTypes: [NSStringPboardType]
          - NSMenuItem:
              default: 存入 Kown 知识库
            NSMessage: kownServiceSaveToKnowledge
            NSPortName: Kown
            NSSendTypes: [NSStringPboardType]
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # 语音听写需要麦克风(hardened runtime 下的资源访问例外)
        com.apple.security.device.audio-input: true
        # 用 AppleScript 控制「备忘录」发 Apple Event,hardened runtime 下必需
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        # 本地构建的默认版本;CI 用命令行覆盖(CURRENT_PROJECT_VERSION=git 提交数)。
        MARKETING_VERSION: "0.32.4"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Sparkle
        product: Sparkle

schemes:
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
