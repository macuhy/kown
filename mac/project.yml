name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
targets:
  Kown:
    type: application
    platform: macOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.4.1"
        CFBundleVersion: "1"
        CFBundleDisplayName: Kown
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 bo xiao"
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI

schemes:
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
