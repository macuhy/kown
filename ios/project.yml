name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
targets:
  Kown:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        # 版本走 build setting:CI 用 MARKETING_VERSION / CURRENT_PROJECT_VERSION 注入
        # (CURRENT_PROJECT_VERSION = git 提交数,每次上传 TestFlight build 号唯一)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Kown
        # 深链:kown://ask?q=...&mode=... / kown://new?mode=... / kown://open?id=...
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaobo.kown
            CFBundleURLSchemes: [kown]
        LSRequiresIPhoneOS: true
        # 加密导出合规 — false 表示仅使用 HTTPS / 系统标准加密(免提交合规文档)。
        # TestFlight / App Store 上架不再每次询问 "is your app using non-exempt encryption"。
        ITSAppUsesNonExemptEncryption: false
        # 语音听写(STT)— 麦克风 + 语音识别授权
        NSMicrophoneUsageDescription: "Kown 用麦克风把你的语音转成文字,填进输入框。"
        NSSpeechRecognitionUsageDescription: "Kown 用语音识别把你说的话转写成文字。"
        # 设备工具:在系统「提醒事项」创建提醒、在「日历」创建/读取日程(备忘录在 iOS 走剪贴板+跳转,无需权限)
        NSRemindersFullAccessUsageDescription: "Kown 可以把你的待办写进系统「提醒事项」。"
        NSCalendarsFullAccessUsageDescription: "Kown 可以把你的日程写进系统「日历」,并读取你最近的安排。"
        UIBackgroundModes:
          - audio   # 流式期间播放无声音频,保持后台网络连接
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iCloud Drive 容器声明 — 与 entitlements 里的 ID 一致。
        # NSUbiquitousContainerIsDocumentScopePublic=false 让 Files app 看不到本应用容器,
        # 避免 API Key 文件出现在用户 iCloud Drive 列表里(数据仍正常跨设备同步)。
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
        # 与分享扩展共享 pending 文本
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        # 本地默认版本;CI 用命令行覆盖(发版走 ios-v* tag → MARKETING_VERSION)。
        MARKETING_VERSION: "0.23.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # 仅当 CI 把 CODE_SIGN_STYLE 覆盖成 Manual 时才生效;本地 Automatic 会忽略它。
        PROVISIONING_PROFILE_SPECIFIER: "Kown AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - target: KownShare
        embed: true

  KownShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Sources/KownShare
        type: group
        name: KownShare
    info:
      path: ShareInfo.plist
      properties:
        CFBundleDisplayName: Kown
        # 版本必须与主 app 一致(CI 用命令行 MARKETING_VERSION/CURRENT_PROJECT_VERSION 覆盖全 target)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: KownShare.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: KownShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.Share
        MARKETING_VERSION: "0.23.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Kown Share AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Release        # ⌘R 直接跑 Release,启动快 5-10×
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
