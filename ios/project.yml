name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
targets:
  Kown:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      # Live Activity 共享层:ActivityAttributes(主 app + KownWidgets 都编)
      # 和 LiveActivityController(只编主 app;KownWidgets 用 excludes 排掉)。
      # 不放 Sources/Kown — 那里同时被 SwiftPM / mac 编译,不能带 ActivityKit。
      - path: Widgets/Shared
        type: group
        name: WidgetsShared
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        # 版本走 build setting:CI 用 MARKETING_VERSION / CURRENT_PROJECT_VERSION 注入
        # (CURRENT_PROJECT_VERSION = git 提交数,每次上传 TestFlight build 号唯一)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Kown
        # 深链:kown://ask?q=...&mode=... / kown://new?mode=... / kown://open?id=...
        CFBundleURLTypes:
          - CFBundleURLName: com.xiaobo.kown
            CFBundleURLSchemes: [kown]
        LSRequiresIPhoneOS: true
        # 深入模式进度上灵动岛 / 锁屏(Live Activity)。
        NSSupportsLiveActivities: true
        # 加密导出合规 — false 表示仅使用 HTTPS / 系统标准加密(免提交合规文档)。
        # TestFlight / App Store 上架不再每次询问 "is your app using non-exempt encryption"。
        ITSAppUsesNonExemptEncryption: false
        # 语音听写(STT)— 麦克风 + 语音识别授权
        NSMicrophoneUsageDescription: "Kown 用麦克风把你的语音转成文字,填进输入框。"
        NSSpeechRecognitionUsageDescription: "Kown 用语音识别把你说的话转写成文字。"
        # 设备工具:在系统「提醒事项」创建提醒、在「日历」创建/读取日程(备忘录在 iOS 走剪贴板+跳转,无需权限)
        NSRemindersFullAccessUsageDescription: "Kown 可以把你的待办写进系统「提醒事项」。"
        NSCalendarsFullAccessUsageDescription: "Kown 可以把你的日程写进系统「日历」,并读取你最近的安排。"
        # AI 键盘截图回复:读最近一张截图、识别其中文字生成回复。授权在主 app 完成,键盘扩展才读得到。
        NSPhotoLibraryUsageDescription: "Kown 需要完整照片权限来读取你最近的截图,识别其中文字,在 AI 键盘里帮你生成回复。"
        UIBackgroundModes:
          - audio   # 流式期间播放无声音频,保持后台网络连接
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iCloud Drive 容器声明 — 与 entitlements 里的 ID 一致。
        # NSUbiquitousContainerIsDocumentScopePublic=false 让 Files app 看不到本应用容器,
        # 避免 API Key 文件出现在用户 iCloud Drive 列表里(数据仍正常跨设备同步)。
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
        # 与分享扩展共享 pending 文本
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        # 本地默认版本;CI 用命令行覆盖(发版走 ios-v* tag → MARKETING_VERSION)。
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # 仅当 CI 把 CODE_SIGN_STYLE 覆盖成 Manual 时才生效;本地 Automatic 会忽略它。
        PROVISIONING_PROFILE_SPECIFIER: "Kown AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - target: KownShare
        embed: true
      - target: KownKeyboard
        embed: true
      - target: KownWatch
        embed: true
      - target: KownWidgets
        embed: true

  KownWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ../Sources/KownWatch
        type: group
        name: KownWatch
      - path: WatchAssets.xcassets
    info:
      path: KownWatch-Info.plist
      properties:
        CFBundleDisplayName: Kown
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # App Store 校验要求表盘也带图标(asset catalog 提供 + Info.plist 声明名字)。
        CFBundleIconName: AppIcon
        # watchOS 单 target SwiftUI app(watchOS 10+):WKApplication=true,关联手机 app。
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.xiaobo.kown
        # 语音输入(听写)授权
        NSMicrophoneUsageDescription: "Kown 用麦克风把你的语音转成文字。"
        NSSpeechRecognitionUsageDescription: "Kown 用语音识别把你说的话转写成文字。"
    entitlements:
      path: KownWatch.entitlements
      properties:
        # 与手机 app 共享 provider 配置(手机写、表盘读)。
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.watchkitapp
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Kown Watch AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      # 表盘复杂功能扩展(WidgetKit),embed 进 watch app 的 PlugIns。
      - target: KownWatchWidgets
        embed: true

  # 表盘复杂功能(WidgetKit accessory 家族):表盘一点即问,点按经 widgetURL 打开 watch app。
  KownWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidgets
        type: group
        name: WatchWidgets
      # 与 watch app 共享的快照读写(App Group UserDefaults 键约定),单文件双 target 编译。
      - path: ../Sources/KownWatch/WatchWidgetShared.swift
    info:
      path: WatchWidgetsInfo.plist
      properties:
        CFBundleDisplayName: Kown
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KownWatchWidgets.entitlements
      properties:
        # 读取 watch app 写入的「最近回答摘要 / 模型名」快照。
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.watchkitapp.widgets
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Kown Watch Widgets AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  KownKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
        type: group
        name: Keyboard
      # 共享 OCR(自包含,只依赖 Vision/UIKit)——键盘截图回复识别文字用,不复制源文件。
      - path: ../Sources/Kown/Services/OCRService.swift
    info:
      path: KeyboardInfo.plist
      properties:
        # 显示在系统键盘列表里的名字
        CFBundleDisplayName: Kown
        # 版本必须与主 app 一致(CI 用命令行 MARKETING_VERSION/CURRENT_PROJECT_VERSION 覆盖全 target)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # 截图回复:键盘扩展读最近截图。授权先在主 app 完成,扩展才有机会读到。
        NSPhotoLibraryUsageDescription: "Kown 键盘需要完整照片权限来读取你最近的截图,识别其中文字帮你生成回复。"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: KownKeyboard.KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hans
            # 联网 + 读 App Group 共享配置必需;用户需在系统设置里允许「完全访问」。
            RequestsOpenAccess: true
    entitlements:
      path: KownKeyboard.entitlements
      properties:
        # 主 app 经 App Group UserDefaults 共享 provider 配置(键盘进程读不到主 app 沙盒)。
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.Keyboard
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Kown Keyboard AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  KownShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ../Sources/KownShare
        type: group
        name: KownShare
    info:
      path: ShareInfo.plist
      properties:
        CFBundleDisplayName: Kown
        # 版本必须与主 app 一致(CI 用命令行 MARKETING_VERSION/CURRENT_PROJECT_VERSION 覆盖全 target)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: KownShare.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: KownShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.Share
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        PROVISIONING_PROFILE_SPECIFIER: "Kown Share AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  KownWidgets:
    type: app-extension
    platform: iOS
    sources:
      # 三个桌面小组件 + Live Activity UI;LiveActivityController 只编主 app(这里排掉)。
      - path: Widgets
        type: group
        name: Widgets
        excludes:
          - Shared/LiveActivityController.swift
      # 快照结构 + 读函数与主 app 共享同一文件(WidgetBridge 只 import Foundation,
      # WidgetKit 部分有 canImport 守护,扩展里编译安全)。
      - path: ../Sources/Kown/Services/WidgetBridge.swift
        name: SharedBridge
    info:
      path: WidgetsInfo.plist
      properties:
        CFBundleDisplayName: Kown
        # 版本必须与主 app 一致(CI 用命令行 MARKETING_VERSION/CURRENT_PROJECT_VERSION 覆盖全 target)。
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: KownWidgets.entitlements
      properties:
        # 读主 app 写入的晨报/用量快照 JSON。
        com.apple.security.application-groups:
          - group.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown.widgets
        MARKETING_VERSION: "0.32.3"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        # 仅当 CI 把 CODE_SIGN_STYLE 覆盖成 Manual 时才生效;本地 Automatic 会忽略它。
        PROVISIONING_PROFILE_SPECIFIER: "Kown Widgets AppStore"
        DEVELOPMENT_TEAM: 4257SFGRFK
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO

schemes:
  KownWatch:
    build:
      targets:
        KownWatch: all
    run:
      config: Debug
    archive:
      config: Release
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Release        # ⌘R 直接跑 Release,启动快 5-10×
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
