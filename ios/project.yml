name: Kown
options:
  bundleIdPrefix: com.xiaobo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
targets:
  Kown:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/Kown
        type: group
        name: Sources
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        CFBundleDisplayName: Kown
        LSRequiresIPhoneOS: true
        # 加密导出合规 — false 表示仅使用 HTTPS / 系统标准加密(免提交合规文档)。
        # TestFlight / App Store 上架不再每次询问 "is your app using non-exempt encryption"。
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio   # 流式期间播放无声音频,保持后台网络连接
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iCloud Drive 容器声明 — 与 entitlements 里的 ID 一致。
        # NSUbiquitousContainerIsDocumentScopePublic=false 让 Files app 看不到本应用容器,
        # 避免 API Key 文件出现在用户 iCloud Drive 列表里(数据仍正常跨设备同步)。
        NSUbiquitousContainers:
          iCloud.com.xiaobo.kown:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Kown
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: Kown.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.xiaobo.kown
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.xiaobo.kown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaobo.kown
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 4257SFGRFK   # 写死付费 Team,Archive 不再每次让人选
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_UPCOMING_FEATURE_STRICT_CONCURRENCY: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI

schemes:
  Kown:
    build:
      targets:
        Kown: all
    run:
      config: Release        # ⌘R 直接跑 Release,启动快 5-10×
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
