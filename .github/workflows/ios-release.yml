# iOS 发版 —— 打 `ios-v*` tag 触发,构建并上传到 TestFlight。
# 与 macOS(release.yml,`v*.*.*` + Sparkle)完全分开:iOS 走 App Store Connect。
#
# 版本:tag `ios-v0.3.1` → MARKETING_VERSION=0.3.1;build 号 = git 提交数(单调递增,每次上传唯一)。
# 签名:manual(导入分发证书 + "Kown AppStore" profile);上传走 App Store Connect API key。
#
# 需要的 secrets(配在 macuhy/kown):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_API_KEY_P8(base64 .p8)
#   IOS_DIST_CERT_P12(base64 .p12), IOS_DIST_CERT_PASSWORD
#   IOS_PROVISION_PROFILE(base64 .mobileprovision)
#   APPLE_TEAM_ID(已有)
name: iOS Release

on:
  push:
    tags: ['ios-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 0.3.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      PROFILE_NAME: "Kown AppStore"
      BUNDLE_ID: "com.xiaobo.kown"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate iOS project
        run: cd ios && xcodegen generate

      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#ios-v}"
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=$VERSION"           >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "iOS $VERSION ($BUILD_NUMBER)"

      - name: Install distribution certificate
        env:
          P12_BASE64:   ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT="$RUNNER_TEMP/dist.p12"
          printf '%s' "$P12_BASE64" | base64 --decode > "$CERT"
          # 不加 -t cert:.p12 是 identity(cert+私钥),-t cert 会干扰类型识别(kit 踩过)。
          security import "$CERT" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          echo "== 签名身份 =="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install provisioning profiles
        env:
          PROFILE_BASE64:       ${{ secrets.IOS_PROVISION_PROFILE }}
          SHARE_PROFILE_BASE64: ${{ secrets.IOS_SHARE_PROVISION_PROFILE }}
        run: |
          set -euo pipefail
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"
          install_profile() {
            local b64="$1" tmp
            tmp="$(mktemp "$RUNNER_TEMP/pp.XXXXXX.mobileprovision")"
            printf '%s' "$b64" | base64 --decode > "$tmp"
            local uuid
            uuid=$(security cms -D -i "$tmp" | plutil -extract UUID raw -)
            cp "$tmp" "$DEST/$uuid.mobileprovision"
            echo "installed profile UUID=$uuid"
          }
          # 主 app(com.xiaobo.kown)+ 分享扩展(com.xiaobo.kown.Share)各一张,都含 App Groups。
          install_profile "$PROFILE_BASE64"
          install_profile "$SHARE_PROFILE_BASE64"

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID:     ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

      - name: Archive
        env:
          VERSION:      ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # 不再传单一 PROVISIONING_PROFILE_SPECIFIER —— 主 app 与分享扩展是两个 bundle id,
          # 各自的 profile 已装进 ~/Library/MobileDevice/Provisioning Profiles/,manual 签名时
          # Xcode 按 bundle id + entitlements 自动匹配。导出再由 ExportOptions.plist 逐 target 指定。
          xcodebuild archive \
            -project ios/Kown.xcodeproj -scheme Kown \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kown.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Export IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kown.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ios/ExportOptions.plist
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID:    ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          echo "uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f "$HOME/.appstoreconnect/private_keys/"*.p8 2>/dev/null || true
