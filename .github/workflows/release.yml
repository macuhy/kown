# 调用方 workflow —— 发布逻辑全在公共 kit 仓库的 reusable workflow。
# 触发: ① git tag v1.2.0 && git push origin v1.2.0   ② Actions 页手动 Run（填版本号）
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.0）'
        required: true

# 默认 GITHUB_TOKEN 是只读；reusable workflow 需要 contents:write（dispatch 打 tag）。
# 被调用方权限不能超过调用方，必须在此显式授予，否则 startup_failure。
permissions:
  contents: write

jobs:
  release:
    uses: macuhy/macos-app-release-kit/.github/workflows/release-reusable.yml@main
    # 跨仓库调用时 secrets: inherit 不会转发组织级 secret，必须显式逐个传。
    secrets:
      DEVELOPER_ID_CERTIFICATE_P12:      ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      APPLE_ID:                          ${{ secrets.APPLE_ID }}
      APPLE_ID_PASSWORD:                 ${{ secrets.APPLE_ID_PASSWORD }}
      APPLE_TEAM_ID:                     ${{ secrets.APPLE_TEAM_ID }}
      SPARKLE_PRIVATE_KEY:               ${{ secrets.SPARKLE_PRIVATE_KEY }}
      RELEASE_REPO_PAT:                  ${{ secrets.RELEASE_REPO_PAT }}
      PROVISIONING_PROFILE_BASE64:       ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
    with:
      app_name: "Kown"
      scheme: "Kown"
      project: "mac/Kown.xcodeproj"
      public_repo: "macuhy/kown-mac"
      download_url_prefix: "https://github.com/macuhy/kown-mac/releases/download/"
      # mac/Kown.xcodeproj 已由 xcodegen 本地生成并提交（含 Sparkle），CI 直接构建
      use_xcodegen: false
      # Kown 带 iCloud entitlement → 需 Developer ID provisioning profile
      provisioning_profile_specifier: "Kown Developer ID"

  # 发版结束后发邮件通知(成功/失败都发)。
  # 需在仓库 Settings ▸ Secrets and variables ▸ Actions 配置:
  #   MAIL_SERVER (如 smtp.gmail.com)、MAIL_PORT (465)、MAIL_USERNAME、MAIL_PASSWORD(Gmail 用应用专用密码)、MAIL_TO
  # 未配置 MAIL_SERVER 时该步骤自动跳过,不会让 workflow 变红。
  notify:
    needs: release
    if: always()
    runs-on: ubuntu-latest
    env:
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
    steps:
      - name: 发送发版结果邮件
        if: ${{ env.MAIL_SERVER != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: ${{ secrets.MAIL_PORT }}
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Kown CI <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "Kown macOS 发版 ${{ needs.release.result }} — ${{ github.ref_name }}"
          body: |
            Kown macOS 发版结果:${{ needs.release.result }}
            Tag / 版本:${{ github.ref_name }}
            提交:${{ github.sha }}
            运行日志:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
